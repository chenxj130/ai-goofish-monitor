services:
  app:
    image: ${APP_IMAGE:-ghcr.io/usagi-org/ai-goofish:latest}
    container_name: ai-goofish-monitor-app
    pull_policy: never
    init: true
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_DATABASE_FILE: /app/data/app.sqlite3
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - ./state:/app/state
      - ./config.json:/app/config.json
      - ./prompts:/app/prompts
      - ./jsonl:/app/jsonl
      - ./logs:/app/logs
      - ./images:/app/images
      - ./price_history:/app/price_history
      - ./src:/app/src
      - ./spider_v2.py:/app/spider_v2.py
      - ./start_xvfb_guard.sh:/app/start_xvfb_guard.sh:ro
    restart: unless-stopped
    # Xvfb 保活启动（独立脚本 start_xvfb_guard.sh）
    #   解决：Xvfb 运行中崩溃 → TargetClosedError → 反复"启动任务失败"
    command: ["bash", "/app/start_xvfb_guard.sh"]
